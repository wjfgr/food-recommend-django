{% extends 'recipe/base.html' %}
{% block title %}添加菜谱 - 珍馐菜谱{% endblock %}

{% block content %}
<div class="heading">
    <div class="line"></div>
    <h2>添加菜谱</h2>
    <p>分享你的拿手好菜 · 发布后系统自动匹配菜品图片</p>
</div>

{% if error %}
<div style="background: rgba(231, 76, 60, 0.1); border: 1px solid rgba(231, 76, 60, 0.3); padding: 16px; margin-bottom: 24px; border-radius: 2px;">
    <div style="color: #e74c3c; font-size: 13px;">{{ error }}</div>
</div>
{% endif %}

<div class="card" style="max-width: 700px; margin: 0 auto;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">菜名 *</label>
            <input type="text" name="name" placeholder="如：番茄炒蛋" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px;">
            <div>
                <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">分类</label>
                <select name="category" style="width: 100%; padding: 12px 16px; background: rgba(201, 168, 76, 0.05); border: 1px solid rgba(201, 168, 76, 0.2); color: var(--text); font-size: 14px; border-radius: 2px; outline: none;">
                    {% for key, name in categories %}
                    <option value="{{ key }}" style="background: #0a0a0a;">{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">难度</label>
                <select name="difficulty" style="width: 100%; padding: 12px 16px; background: rgba(201, 168, 76, 0.05); border: 1px solid rgba(201, 168, 76, 0.2); color: var(--text); font-size: 14px; border-radius: 2px; outline: none;">
                    <option value="简单" style="background: #0a0a0a;">简单</option>
                    <option value="中等" style="background: #0a0a0a;">中等</option>
                    <option value="困难" style="background: #0a0a0a;">困难</option>
                </select>
            </div>
            <div>
                <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">时长(分钟)</label>
                <input type="number" name="duration" value="15" min="1">
            </div>
        </div>
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">简介</label>
            <textarea name="description" rows="2" placeholder="简单介绍一下这道菜..." style="width: 100%; padding: 14px 18px; background: rgba(201, 168, 76, 0.05); border: 1px solid rgba(201, 168, 76, 0.2); color: var(--text); font-size: 14px; border-radius: 2px; outline: none; box-sizing: border-box; font-family: 'Noto Serif SC', serif; resize: vertical;"></textarea>
        </div>
        
        <div style="margin-bottom: 24px;">
            <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">菜品图片 <span style="color: var(--text-3); font-size: 12px;">（可选，不上传则系统自动匹配）</span></label>
            <input type="file" name="image" accept="image/*" style="width: 100%; padding: 12px 16px; background: rgba(201, 168, 76, 0.05); border: 1px solid rgba(201, 168, 76, 0.2); color: var(--text); font-size: 14px; border-radius: 2px; outline: none; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 30px;">
            <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">所需食材 *</label>
            <div id="ingredients-list">
                <div class="ing-row" style="display: grid; grid-template-columns: 1fr 1fr 40px; gap: 12px; margin-bottom: 12px;">
                    <input type="text" name="ing_name[]" placeholder="食材名，如：番茄">
                    <input type="text" name="ing_amount[]" placeholder="用量，如：2个">
                    <button type="button" onclick="this.parentElement.remove()" style="background: none; border: 1px solid rgba(231, 76, 60, 0.3); color: #e74c3c; border-radius: 2px; cursor: pointer;">×</button>
                </div>
            </div>
            <button type="button" onclick="addIngredient()" style="margin-top: 8px; background: none; border: 1px solid rgba(201, 168, 76, 0.3); color: var(--gold); padding: 8px 16px; border-radius: 2px; cursor: pointer; font-size: 13px;">+ 添加食材</button>
        </div>
        
        <div style="margin-bottom: 36px;">
            <label style="display: block; margin-bottom: 10px; color: var(--text-2); letter-spacing: 1px; font-size: 13px;">做法步骤 *</label>
            <textarea name="steps" rows="8" placeholder="每行写一步，如：&#10;1. 番茄切块&#10;2. 鸡蛋打散&#10;3. 先炒鸡蛋盛出&#10;4. 再炒番茄出汁&#10;5. 倒回鸡蛋翻炒" required style="width: 100%; padding: 14px 18px; background: rgba(201, 168, 76, 0.05); border: 1px solid rgba(201, 168, 76, 0.2); color: var(--text); font-size: 14px; border-radius: 2px; outline: none; box-sizing: border-box; font-family: 'Noto Serif SC', serif; resize: vertical; line-height: 1.8;"></textarea>
        </div>
        
        <button type="submit" class="btn btn-block">发布菜谱</button>
    </form>
</div>

<script>
function addIngredient() {
    const list = document.getElementById('ingredients-list');
    const row = document.createElement('div');
    row.className = 'ing-row';
    row.style.cssText = 'display: grid; grid-template-columns: 1fr 1fr 40px; gap: 12px; margin-bottom: 12px;';
    row.innerHTML = `
        <input type="text" name="ing_name[]" placeholder="食材名，如：番茄">
        <input type="text" name="ing_amount[]" placeholder="用量，如：2个">
        <button type="button" onclick="this.parentElement.remove()" style="background: none; border: 1px solid rgba(231, 76, 60, 0.3); color: #e74c3c; border-radius: 2px; cursor: pointer;">×</button>
    `;
    list.appendChild(row);
}
</script>

<style>
    input[type="text"], input[type="number"], textarea, select {
        width: 100%;
        padding: 12px 16px;
        background: rgba(201, 168, 76, 0.05);
        border: 1px solid rgba(201, 168, 76, 0.2);
        color: var(--text);
        font-size: 14px;
        border-radius: 2px;
        outline: none;
        transition: all 0.3s;
        box-sizing: border-box;
        font-family: 'Noto Serif SC', serif;
    }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
        border-color: var(--gold);
        background: rgba(201, 168, 76, 0.1);
    }
</style>
{% endblock %}
